name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      # The race gate the project treats as mandatory before every push.
      # -short skips the heavy deterministic tests (skipHeavy): the detector
      # has nothing to find in a chunk-generation census and makes it ten
      # times slower. -p 1 keeps the hub tests' real server loops from
      # starving behind another package's generation. ~15 min.
      - run: go test -race -short -p 1 -timeout 2400s ./...
